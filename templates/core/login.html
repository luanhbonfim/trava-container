{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="card card-login">
    <h1>Entrar</h1>
    <p class="sub">Acesse com seu usuário para controlar a trava.</p>

    {% if form.errors %}
    <p class="msg error">Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus required>

        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" required>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-azul">Entrar</button>
    </form>
</div>
{% endblock %}
